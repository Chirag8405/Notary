# `docker compose up` brings up the demo: web at :3000/x-ray, server at :8000.
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_NOTARY_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
