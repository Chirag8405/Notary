[project]
name = "notary-mcp-proxy"
version = "0.0.0"
description = "MCP gateway wrapping core (tool pinning, labeling)"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["notary-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notary_mcp_proxy"]

[project.scripts]
notary-mcp-proxy = "notary_mcp_proxy.main:main"
