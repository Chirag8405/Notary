[project]
name = "notary-core"
version = "0.0.0"
description = "NOTARY core: pure, deterministic models and reference monitor"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.14,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notary_core"]

# Dev-only mutation testing (mutmut). Run from this directory; see docs/decisions.md.
[tool.mutmut]
source_paths = ["src/notary_core"]
only_mutate = ["src/notary_core/monitor.py", "src/notary_core/steps/*.py"]
pytest_add_cli_args_test_selection = ["tests"]
# test_core_purity scans the mutated copy, which mutmut rewrites to import its trampoline.
pytest_add_cli_args = ["-p", "no:cacheprovider", "--ignore=tests/test_core_purity.py"]
