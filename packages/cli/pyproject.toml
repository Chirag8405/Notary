[project]
name = "notary-cli"
version = "0.0.0"
description = "Command line: fuzz, replay, bench, attack"
requires-python = ">=3.12,<3.13"
dependencies = ["notary-core", "notary-world", "typer>=0.27"]

[project.scripts]
notary = "notary_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notary_cli"]
