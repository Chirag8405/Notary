[project]
name = "notary-world"
version = "0.0.0"
description = "NOTARY world: seeded deterministic fixtures, attack library and LLM cassettes"
requires-python = ">=3.12,<3.13"
dependencies = ["notary-core", "hypothesis>=6.170"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notary_world"]
