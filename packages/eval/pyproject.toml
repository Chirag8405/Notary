[project]
name = "notary-eval"
version = "0.0.0"
description = "AgentDojo harness and results export for charts"
requires-python = ">=3.12,<3.13"
dependencies = ["notary-core", "notary-world"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notary_eval"]
