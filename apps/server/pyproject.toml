[project]
name = "notary-server"
version = "0.0.0"
description = "NOTARY server: FastAPI REST + WebSocket event stream, agent runner, world host"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "notary-core",
  "notary-world",
  "notary-mcp-proxy",
  "anyio>=4.15",
  "fastapi>=0.143",
  "uvicorn>=0.54,<0.55",
  "websockets>=17,<18",
  "groq>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notary_server"]
