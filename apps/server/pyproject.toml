[project]
name = "notary-server"
version = "0.0.0"
description = "NOTARY server: FastAPI REST + WebSocket event stream, agent runner, world host"
requires-python = ">=3.12,<3.13"
dependencies = [
  "notary-core",
  "notary-world",
  "notary-mcp-proxy",
  "fastapi>=0.143",
  "uvicorn>=0.54",
  "websockets>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notary_server"]
